<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NimbusEngine</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235e95ff'/%3E%3Cstop offset='1' stop-color='%238c6eff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='7' fill='url(%23g)'/%3E%3Cpath d='M6 18C3.79 18 2 16.21 2 14C2 12.09 3.36 10.5 5.17 10.09C5.06 9.65 5 9.19 5 8.71C5 5.55 7.55 3 10.71 3C13.29 3 15.47 4.71 16.19 7.07C16.46 7.02 16.73 7 17 7C19.76 7 22 9.24 22 12C22 14.76 19.76 17 17 17H6V18Z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f19;
    --bg-glow: radial-gradient(circle at 20% -10%, rgba(94, 149, 255, 0.18), transparent 45%),
               radial-gradient(circle at 90% 10%, rgba(140, 110, 255, 0.14), transparent 40%);
    --surface: #121826;
    --card: #161d2e;
    --border: #262f45;
    --border-hover: #3a4666;
    --text: #eef1f8;
    --text-muted: #8b93a7;
    --text-faint: #4d5670;
    --accent: #5e95ff;
    --accent-soft: rgba(94, 149, 255, 0.12);
    --success: #4ade80;
    --error: #f87171;
    --warn: #fbbf24;
    --radius: 14px;
    --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: var(--bg-glow);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 40px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
  }

  .logo-mark {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, #5e95ff, #8c6eff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(94, 149, 255, 0.45);
  }

  .nav-links {
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .nav-links span {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 100px;
  }

  .hero {
    margin-bottom: 36px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(94, 149, 255, 0.3);
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 18px;
  }

  .eyebrow .pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .hero h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    line-height: 1.3;
  }

  .hero p {
    color: var(--text-muted);
    font-size: 14.5px;
    margin: 0;
    line-height: 1.6;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 6px;
    margin-bottom: 4px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    border-radius: 9px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border-hover);
  }

  .body-pad {
    padding: 18px 22px 22px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 11px 13px;
    border-radius: 9px;
    outline: none;
    font-family: var(--mono);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .field input::placeholder {
    color: var(--text-faint);
  }

  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }

  button {
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: opacity 0.15s, background 0.15s, transform 0.1s;
  }

  button:active { transform: scale(0.98); }

  .btn-primary {
    background: linear-gradient(135deg, #5e95ff, #7c6eff);
    color: #fff;
    flex: 1;
    box-shadow: 0 8px 20px -6px rgba(94, 149, 255, 0.55);
  }

  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-secondary:hover { border-color: var(--border-hover); }

  .result {
    margin-top: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
    background: var(--card);
  }

  .result.show { display: block; }

  .result-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
  }

  .dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .dot.err { background: var(--error); box-shadow: 0 0 8px var(--error); }
  .dot.pending { background: var(--warn); animation: pulse 1s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  pre {
    margin: 0;
    padding: 16px 18px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.7;
    color: #a5d8ff;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .live-link {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(94, 149, 255, 0.14), rgba(140, 110, 255, 0.1));
    border: 1px solid rgba(94, 149, 255, 0.35);
    border-radius: var(--radius);
  }

  .live-link.show { display: flex; }

  .live-link-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .live-link-info .dot.ok { flex-shrink: 0; }

  .live-link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .live-link-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .live-link a {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .live-link a:hover { text-decoration: underline; }

  .live-link a.live-link-open {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 7px;
    text-decoration: none;
    white-space: nowrap;
  }

  .live-link-open:hover { opacity: 0.85; }

  .history-card {
    margin-top: 40px;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .history-header h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }

  .history-refresh {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    padding: 6px 12px;
  }

  .history-refresh:hover { border-color: var(--border-hover); color: var(--text); }

  .history-empty {
    color: var(--text-faint);
    font-size: 13px;
    padding: 24px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    background: var(--card);
  }

  .history-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .history-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-source {
    font-size: 11px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 8px;
    flex-shrink: 0;
  }

  .history-item-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .history-time {
    font-size: 11px;
    color: var(--text-faint);
  }

  .history-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .history-badge.created { background: rgba(74, 222, 128, 0.15); color: var(--success); }
  .history-badge.build_failed { background: rgba(248, 113, 113, 0.15); color: var(--error); }
  .history-badge.deleted { background: rgba(139, 147, 167, 0.15); color: var(--text-muted); }

  footer {
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    margin-top: 36px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M6 18C3.79 18 2 16.21 2 14C2 12.09 3.36 10.5 5.17 10.09C5.06 9.65 5 9.19 5 8.71C5 5.55 7.55 3 10.71 3C13.29 3 15.47 4.71 16.19 7.07C16.46 7.02 16.73 7 17 7C19.76 7 22 9.24 22 12C22 14.76 19.76 17 17 17H6V18Z" fill="white"/>
        </svg>
      </div>
      NimbusEngine
    </div>
  </div>

  <main>
    <div class="hero">
      <div class="eyebrow"><span class="pulse"></span>클러스터 연결됨</div>
      <h1>구름처럼 가볍게,<br>학교 서버에 배포하세요.</h1>
      <p>Docker 이미지나 GitHub 저장소만 있으면, 나머지(네임스페이스·빌드·라우팅)는 NimbusEngine이 처리합니다.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" data-tab="image">Docker 이미지</div>
        <div class="tab" data-tab="repo">GitHub 저장소</div>
      </div>

      <div class="body-pad">
        <div class="field">
          <label>API 키</label>
          <input id="apiKey" type="password" placeholder="배포/삭제에 필요한 API 키">
        </div>

        <div class="field">
          <label>프로젝트 이름</label>
          <input id="name" placeholder="my-app">
        </div>

        <div class="panel active" id="panel-image">
          <div class="field">
            <label>Docker 이미지</label>
            <input id="image" placeholder="nginx:latest">
          </div>
        </div>

        <div class="panel" id="panel-repo">
          <div class="field">
            <label>GitHub 저장소 URL</label>
            <input id="repo" placeholder="https://github.com/user/repo">
          </div>
        </div>

        <div class="actions">
          <button class="btn-primary" id="deployBtn" onclick="deployApp()">Deploy</button>
          <button class="btn-secondary" onclick="checkStatus()">상태 확인</button>
          <button class="btn-secondary" onclick="deleteApp()">삭제</button>
        </div>
      </div>
    </div>

    <div class="live-link" id="liveLink">
      <div class="live-link-info">
        <span class="dot ok"></span>
        <div class="live-link-text">
          <span class="live-link-label">배포된 주소</span>
          <a id="liveLinkUrl" href="#" target="_blank" rel="noopener"></a>
        </div>
      </div>
      <a class="live-link-open" id="liveLinkOpen" href="#" target="_blank" rel="noopener">열기 ↗</a>
    </div>

    <div class="result" id="resultBox">
      <div class="result-head">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Response</span>
      </div>
      <pre id="result"></pre>
    </div>

    <div class="history-card">
      <div class="history-header">
        <h2>배포 기록</h2>
        <button class="history-refresh" onclick="loadHistory()">새로고침</button>
      </div>
      <div id="historyList"></div>
    </div>

    <footer>NimbusEngine &middot; kubeadm + Kaniko 기반 온프렘 배포 플랫폼</footer>
  </main>

  <script>
    const API_BASE = "/api";
    let mode = "image";

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        mode = tab.dataset.tab;
        document.getElementById(`panel-${mode}`).classList.add("active");
        sessionStorage.setItem("nimbus_mode", mode);
      });
    });

    // 새로고침하면 유지되지만, 탭/창을 닫으면 초기화되도록 sessionStorage에 저장/복원
    const PERSIST_FIELDS = ["apiKey", "name", "image", "repo"];

    PERSIST_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("input", () => {
        sessionStorage.setItem(`nimbus_${id}`, el.value);
      });
    });

    function restoreFormState() {
      PERSIST_FIELDS.forEach(id => {
        const saved = sessionStorage.getItem(`nimbus_${id}`);
        if (saved) document.getElementById(id).value = saved;
      });
      const savedMode = sessionStorage.getItem("nimbus_mode");
      if (savedMode === "repo") {
        document.querySelector('.tab[data-tab="repo"]').click();
      }
    }

    restoreFormState();

    function setStatus(state, label) {
      const dot = document.getElementById("statusDot");
      const text = document.getElementById("statusText");
      dot.className = "dot " + state;
      text.textContent = label;
    }

    function showLiveLink(url) {
      const box = document.getElementById("liveLink");
      if (!url) {
        box.classList.remove("show");
        return;
      }
      document.getElementById("liveLinkUrl").textContent = url;
      document.getElementById("liveLinkUrl").href = url;
      document.getElementById("liveLinkOpen").href = url;
      box.classList.add("show");
    }

    function showResult(data) {
      document.getElementById("resultBox").classList.add("show");
      showLiveLink(data.url);
      if (data.logs) {
        const { logs, ...rest } = data;
        document.getElementById("result").textContent =
          JSON.stringify(rest, null, 2) + "\n\n--- 빌드 로그 ---\n" + logs;
      } else {
        document.getElementById("result").textContent = JSON.stringify(data, null, 2);
      }
    }

    async function withLoading(fn) {
      const btn = document.getElementById("deployBtn");
      btn.disabled = true;
      setStatus("pending", "요청 처리 중...");
      try {
        await fn();
      } catch (e) {
        setStatus("err", "요청 실패");
        showResult({ error: String(e) });
      } finally {
        btn.disabled = false;
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function pollBuildStatus(name) {
      let seconds = 0;
      while (true) {
        setStatus("pending", `이미지 빌드 중... (${seconds}초 경과)`);
        const res = await fetch(`${API_BASE}/deploy-from-repo/${encodeURIComponent(name)}/status`);
        const data = await res.json();

        if (data.status === "building") {
          await sleep(2000);
          seconds += 2;
          continue;
        }

        const ok = data.status === "created";
        setStatus(ok ? "ok" : "err", ok ? "배포 완료" : "배포 실패");
        showResult(data);
        loadHistory();
        return;
      }
    }

    function authHeaders() {
      const key = document.getElementById("apiKey").value;
      return key ? { "X-API-Key": key } : {};
    }

    async function deployApp() {
      const name = document.getElementById("name").value;
      withLoading(async () => {
        if (mode === "image") {
          const image = document.getElementById("image").value;
          const res = await fetch(`${API_BASE}/deployments?name=${encodeURIComponent(name)}&image=${encodeURIComponent(image)}`, {
            method: "POST",
            headers: authHeaders()
          });
          const data = await res.json();
          setStatus(res.ok ? "ok" : "err", res.ok ? "배포 완료" : "배포 실패 (API 키 확인)");
          showResult(data);
          loadHistory();
        } else {
          const repo = document.getElementById("repo").value;
          const res = await fetch(`${API_BASE}/deploy-from-repo?name=${encodeURIComponent(name)}&repo_url=${encodeURIComponent(repo)}`, {
            method: "POST",
            headers: authHeaders()
          });
          const data = await res.json();
          if (!res.ok || data.status !== "building") {
            setStatus("err", res.status === 401 ? "인증 실패 (API 키 확인)" : "요청 실패");
            showResult(data);
            return;
          }
          await pollBuildStatus(name);
        }
      });
    }

    async function checkStatus() {
      const name = document.getElementById("name").value;
      withLoading(async () => {
        const res = await fetch(`${API_BASE}/deployments/${encodeURIComponent(name)}`);
        const data = await res.json();
        setStatus(res.ok ? "ok" : "err", "상태 조회됨");
        showResult(data);
      });
    }

    async function deleteApp() {
      const name = document.getElementById("name").value;
      withLoading(async () => {
        const res = await fetch(`${API_BASE}/deployments/${encodeURIComponent(name)}`, {
          method: "DELETE",
          headers: authHeaders()
        });
        const data = await res.json();
        setStatus(res.ok ? "ok" : "err", res.ok ? "삭제됨" : "삭제 실패 (API 키 확인)");
        showResult(data);
        loadHistory();
      });
    }

    const HISTORY_LABELS = {
      created: "생성됨",
      build_failed: "빌드 실패",
      deleted: "삭제됨"
    };

    function formatTime(isoString) {
      const d = new Date(isoString + "Z");
      return d.toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    async function loadHistory() {
      const listEl = document.getElementById("historyList");
      try {
        const res = await fetch(`${API_BASE}/history`);
        const items = await res.json();

        if (!items.length) {
          listEl.innerHTML = '<div class="history-empty">아직 배포 기록이 없습니다.</div>';
          return;
        }

        listEl.innerHTML = items.map(item => `
          <div class="history-item">
            <div class="history-item-left">
              <span class="history-name">${item.name}</span>
              <span class="history-source">${item.source}</span>
            </div>
            <div class="history-item-right">
              <span class="history-time">${formatTime(item.created_at)}</span>
              <span class="history-badge ${item.status}">${HISTORY_LABELS[item.status] || item.status}</span>
            </div>
          </div>
        `).join("");
      } catch (e) {
        listEl.innerHTML = '<div class="history-empty">기록을 불러오지 못했습니다.</div>';
      }
    }

    loadHistory();
  </script>
</body>
</html>
